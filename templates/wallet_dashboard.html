<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>MusicChain</title>    <link rel="stylesheet" type="text/css" href="{{ url_for('static', path='styles.css') }}"></head><body class="body-dashboard">    <div class="container">        <!-- Заголовок -->        <h1>Welcome to your wallet MusicChain, {{ request.session.username }}!</h1>        <!-- Баланс токенов MC и BNB -->        <div class="user2">            <div class="img">                <img src="{{ url_for('static', path='coinbid.png') }}" alt="Balance Icon" width="180" height="150">            </div>            <div class="tokens">                <h2 class="h2-dashboard">Your tokens MC: <span id="tokenBalance">{{ balance }}</span></h2>                <h2 class="h2-dashboard">Your BNB: <span id="bnbBalance">{{ bnb_balance }}</span></h2>            </div>        </div>        <!-- Управление воспроизведением -->        <div class="user2">            <button id="playRandom">Play Random Song</button>            <button id="stop" disabled>Stop</button>            <button id="pauseResume" disabled>Pause</button>        </div>        <p id="currentSong">No song is currently playing</p>        <audio id="audioPlayer" controls style="display: none;"></audio>        <!-- Загрузка музыки -->        <div class="user">            <h2 class="h2-dashboard">Upload your music and get coins MC:</h2>            <form id="uploadForm" enctype="multipart/form-data">                <input type="file" name="file" accept=".mp3" required>                <button type="submit" id="uploadButton">Upload File</button>            </form>        </div>        <!-- Информация о кошельке -->        <div class="wallet-info-box">            <h2 class="h2-dashboard">Your wallet information:</h2>            <p>Address:</p>            <p class="wallet-p">{{ address }}</p>        </div>        <!-- Отображение приватного ключа -->        <div class="user2">            <div class="key-display">                <button id="showPrivateKey" class="btn-show">Show Private Key</button>                <p class="wallet-p" id="privateKeyDisplay">Private key</p>            </div>        </div>        <!-- Перевод токенов -->        <div class="wallet-info-box">            <h2>Transfer funds:</h2>            <form id="transferForm">                <input type="text" name="recipient_address" placeholder="Recipient Address" class="login-input" required>                <input type="number" name="amount" placeholder="Amount" class="login-input" step="0.01" min="0" required>                <div class="form-buttons">                    <button type="button" id="transferButton">Transfer Funds</button>                    <button type="button" id="logoutButton">Logout</button>                </div>            </form>        </div>    </div>    <script>        console.log("Script started");        // Переменные из Jinja        const walletAddress = "{{ address }}";        const privateKey = "{{ private_key }}";        console.log("Wallet address:", walletAddress);        // Элементы управления        const audioPlayer = document.getElementById("audioPlayer");        const currentSongText = document.getElementById("currentSong");        const playButton = document.getElementById("playRandom");        const stopButton = document.getElementById("stop");        const pauseResumeButton = document.getElementById("pauseResume");        let audioFiles = [];        let lastPlayedIndex = -1;        // Функция обновления баланса        function updateBalance() {            if (!walletAddress) {                console.error("No wallet address provided");                return;            }            fetch(`/get_balance?wallet_address=${walletAddress}`)                .then(response => {                    if (!response.ok) throw new Error(`HTTP error: ${response.status}`);                    return response.json();                })                .then(data => {                    console.log("Balance data:", data);                    document.getElementById("tokenBalance").innerText = Number(data.token_balance).toFixed(2) || "N/A";                    document.getElementById("bnbBalance").innerText = Number(data.bnb_balance).toFixed(6) || "N/A";                })                .catch(error => console.error("Error fetching balance:", error));        }        // Функция воспроизведения случайного трека        function playRandomSong() {            if (!audioFiles.length) {                currentSongText.textContent = "No songs available.";                console.log("No audio files available");                return;            }            let randomIndex;            do {                randomIndex = Math.floor(Math.random() * audioFiles.length);            } while (randomIndex === lastPlayedIndex && audioFiles.length > 1);            lastPlayedIndex = randomIndex;            const randomFile = audioFiles[randomIndex];            const timestamp = new Date().getTime();            console.log("Fetching track:", randomFile);            fetch(`/play/${encodeURIComponent(randomFile)}?t=${timestamp}`)                .then(response => {                    if (!response.ok) {                        return response.json().then(errorData => {                            throw new Error(errorData.detail || "Unknown error");                        });                    }                    return response.blob();                })                .then(blob => {                    const audioUrl = URL.createObjectURL(blob);                    audioPlayer.src = audioUrl;                    audioPlayer.play();                    currentSongText.textContent = `Now playing: ${randomFile}`;                    stopButton.disabled = false;                    pauseResumeButton.disabled = false;                    pauseResumeButton.textContent = "Pause";                    updateBalance();                })                .catch(error => {                    console.error("Error playing song:", error);                    currentSongText.textContent = `Error: ${error.message}`;                });        }        // Загрузка списка треков        fetch("/list")            .then(response => {                if (!response.ok) throw new Error(`HTTP error: ${response.status}`);                return response.json();            })            .then(files => {                audioFiles = files || [];                console.log("Loaded audio files:", audioFiles);                if (audioFiles.length > 0) {                    playButton.disabled = false;                }            })            .catch(error => console.error("Error loading track list:", error));        // Обработчики событий        playButton.addEventListener("click", () => {            console.log("Play Random Song clicked");            playRandomSong();        });        stopButton.addEventListener("click", () => {            console.log("Stop clicked");            audioPlayer.pause();            audioPlayer.currentTime = 0;            currentSongText.textContent = "Playback stopped.";            stopButton.disabled = true;            pauseResumeButton.disabled = true;        });        pauseResumeButton.addEventListener("click", () => {            console.log("Pause/Resume clicked");            if (audioPlayer.paused) {                audioPlayer.play();                pauseResumeButton.textContent = "Pause";            } else {                audioPlayer.pause();                pauseResumeButton.textContent = "Resume";            }        });        audioPlayer.addEventListener("ended", () => {            console.log("Song ended");            playRandomSong();        });        audioPlayer.addEventListener("error", () => {            console.error("Audio error");            currentSongText.textContent = "Error playing file. Trying another...";            playRandomSong();        });        document.getElementById("showPrivateKey").addEventListener("click", () => {            console.log("Show Private Key clicked");            const privateKeyDisplay = document.getElementById("privateKeyDisplay");            if (privateKeyDisplay.textContent === "Private key") {                privateKeyDisplay.textContent = privateKey;                this.textContent = "Hide Private Key";            } else {                privateKeyDisplay.textContent = "Private key";                this.textContent = "Show Private Key";            }        });        document.getElementById("transferButton").addEventListener("click", () => {            console.log("Transfer Funds clicked");            const formData = new FormData(document.getElementById("transferForm"));            fetch("/transfer", {                method: "POST",                body: formData            })                .then(response => {                    if (!response.ok) {                        return response.json().then(errorData => {                            throw new Error(errorData.detail || `HTTP error: ${response.status}`);                        });                    }                    return response.json();                })                .then(data => {                    console.log("Transfer successful:", data);                    alert("Transfer successful!");                    updateBalance();                })                .catch(error => {                    console.error("Transfer error:", error);                    alert("Transfer error: " + error.message);                });        });        document.getElementById("logoutButton").addEventListener("click", () => {            console.log("Logout clicked");            fetch("/logout", { method: "GET" })                .then(response => {                    if (!response.ok) throw new Error(`HTTP error: ${response.status}`);                    window.location.href = "/";                })                .catch(error => alert("Logout error: " + error.message));        });        document.getElementById("uploadForm").addEventListener("submit", (e) => {            console.log("Upload File submitted");            e.preventDefault();            const formData = new FormData(document.getElementById("uploadForm"));            fetch("/upload_file", {                method: "POST",                body: formData            })                .then(response => {                    if (!response.ok) {                        return response.json().then(errorData => {                            throw new Error(errorData.detail || "Upload failed");                        });                    }                    alert("File uploaded successfully!");                    updateBalance();                })                .catch(error => alert("Upload error: " + error.message));        });        // Инициализация        console.log("Initializing...");        setInterval(updateBalance, 5000);        updateBalance();    </script></body></html>
