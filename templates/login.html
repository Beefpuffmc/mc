<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', path='styles.css') }}">
</head>
<body>
    <main class="main">
        <div class="hero">
            <h1>Login</h1>
            <form action="{{ url_for('login') }}" method="POST">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" class="login-input">
                
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" class="login-input">
                
                <p>OR</p>
                
                <label for="private_key">Private Key:</label>
                <input type="text" id="private_key" name="private_key" class="login-input">
                
                <input type="submit" value="Login" class="login-input login-btn">
                
                <!-- Кнопка "Вернуться на главную" -->
                <a href="{{ url_for('index') }}" class="back-btn">Back to Home</a>
            </form>
        </div>
    </main>
</body>
</html>
