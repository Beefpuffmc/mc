<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Register</title>    <link rel="stylesheet" type="text/css" href="{{ url_for('static', path='styles.css') }}"></head><body>    <main class="main">        <div class="hero">            <h1>Register</h1>            <form method="post">                <label for="username">Username:</label>                <input type="text" id="username" name="username" class="login-input">                <label for="password">Password:</label>                <input type="password" id="password" name="password" class="login-input">                <input type="submit" value="Register" class="login-input login-btn">            </form>            <!-- Кнопка "Вернуться на главную" -->            <a href="{{ url_for('index') }}" class="back-btn">Back to Home</a>        </div>    </main></body></html>
